<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <style>
    @keyframes drop { 0% { transform: translateY(-20px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(120px); opacity: 0; } }
    @keyframes reveal { 0%, 70% { opacity: 0; } 100% { opacity: 1; } }
    .char { animation: drop 2s linear infinite; }
    .copyright { animation: reveal 1s ease-out 1.5s both; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="14" ry="14"/>

  <!-- Matrix falling characters -->
  <!-- Column 1 -->
  <text x="40" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.8" class="char" style="animation-delay:0s; animation-duration:1.8s">0</text>
  <text x="60" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.6" class="char" style="animation-delay:0.3s; animation-duration:2.1s">1</text>
  <text x="80" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.7" class="char" style="animation-delay:0.6s; animation-duration:1.9s">{</text>
  <text x="100" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.5" class="char" style="animation-delay:0.2s; animation-duration:2.2s">}</text>
  <text x="120" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.9" class="char" style="animation-delay:0.8s; animation-duration:1.7s">;</text>
  <text x="140" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.6" class="char" style="animation-delay:0.1s; animation-duration:2.0s">/</text>
  <text x="160" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.8" class="char" style="animation-delay:0.5s; animation-duration:1.8s">*</text>
  <text x="180" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.7" class="char" style="animation-delay:0.4s; animation-duration:2.3s">=</text>
  <text x="200" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.5" class="char" style="animation-delay:0.7s; animation-duration:1.9s">+</text>
  <text x="220" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.6" class="char" style="animation-delay:0.9s; animation-duration:2.1s">-</text>

  <!-- Column 2 -->
  <text x="300" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.7" class="char" style="animation-delay:0.2s; animation-duration:2.0s">0</text>
  <text x="320" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.9" class="char" style="animation-delay:0.5s; animation-duration:1.8s">1</text>
  <text x="340" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.6" class="char" style="animation-delay:0.1s; animation-duration:2.2s">[</text>
  <text x="360" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.8" class="char" style="animation-delay:0.4s; animation-duration:1.7s">]</text>
  <text x="380" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.5" class="char" style="animation-delay:0.7s; animation-duration:2.1s">&lt;</text>
  <text x="400" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.7" class="char" style="animation-delay:0.3s; animation-duration:1.9s">&gt;</text>
  <text x="420" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.6" class="char" style="animation-delay:0.8s; animation-duration:2.0s">!</text>
  <text x="440" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.9" class="char" style="animation-delay:0.6s; animation-duration:1.8s">@</text>
  <text x="460" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.5" class="char" style="animation-delay:0.2s; animation-duration:2.3s">#</text>
  <text x="480" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.8" class="char" style="animation-delay:0.9s; animation-duration:1.7s">$</text>

  <!-- Column 3 -->
  <text x="560" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.6" class="char" style="animation-delay:0.3s; animation-duration:2.1s">0</text>
  <text x="580" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.8" class="char" style="animation-delay:0.6s; animation-duration:1.9s">1</text>
  <text x="600" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.5" class="char" style="animation-delay:0.1s; animation-duration:2.2s">%</text>
  <text x="620" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.7" class="char" style="animation-delay:0.4s; animation-duration:1.8s">^</text>
  <text x="640" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.9" class="char" style="animation-delay:0.8s; animation-duration:2.0s">&amp;</text>
  <text x="660" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.6" class="char" style="animation-delay:0.2s; animation-duration:1.7s">*</text>
  <text x="680" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.8" class="char" style="animation-delay:0.7s; animation-duration:2.3s">(</text>
  <text x="700" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.5" class="char" style="animation-delay:0.5s; animation-duration:1.9s">)</text>
  <text x="720" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.7" class="char" style="animation-delay:0.9s; animation-duration:2.1s">_</text>
  <text x="740" y="0" fill="#f97316" font-family="ui-monospace, monospace" font-size="11" opacity="0.6" class="char" style="animation-delay:0.3s; animation-duration:1.8s">+</text>

  <!-- Copyright text -->
  <g class="copyright">
    <text x="400" y="85" fill="#f97316" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" font-weight="bold">© 2026 Himath Rajapaksha</text>
    <text x="400" y="105" fill="#6b7280" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">securing the stack // one commit at a time</text>
  </g>
</svg>
