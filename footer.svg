<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <style>
    .wave { animation: sway 4s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { d: path("M0,60 Q200,20 400,60 T800,60 L800,120 L0,120 Z"); } 50% { d: path("M0,60 Q200,100 400,60 T800,60 L800,120 L0,120 Z"); } }
  </style>
  <defs>
    <linearGradient id="wave-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d0d10" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0d0d10" rx="14" ry="14"/>
  <path d="M0,60 Q200,20 400,60 T800,60 L800,120 L0,120 Z" fill="url(#wave-grad)" class="wave"/>
  <text x="400" y="50" fill="#a5a5b3" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" opacity="0.6">Built with passion from Sri Lanka</text>
</svg>
