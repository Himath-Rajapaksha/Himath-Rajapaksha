<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100">
  <style>
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
    @keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .dot { animation: pulse 2s ease-in-out infinite; }
    .scanline { animation: scan 3s linear infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="14" ry="14"/>
  <!-- Center line -->
  <line x1="100" y1="50" x2="700" y2="50" stroke="url(#line)" stroke-width="1"/>
  <!-- Scanning effect -->
  <rect x="0" y="48" width="60" height="4" fill="#dc2626" opacity="0.15" rx="2" class="scanline"/>
  <!-- Dots -->
  <circle cx="100" cy="50" r="2" fill="#dc2626" class="dot"/>
  <circle cx="400" cy="50" r="3" fill="#dc2626" opacity="0.8"/>
  <circle cx="700" cy="50" r="2" fill="#dc2626" class="dot"/>
  <!-- Text -->
  <text x="400" y="40" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle" opacity="0.5">securing the stack // one commit at a time</text>
  <text x="400" y="68" fill="#6b7280" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" opacity="0.3">© 2026 himath</text>
</svg>
