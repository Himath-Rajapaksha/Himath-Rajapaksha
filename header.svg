<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <style>
    .line { animation: draw 2s ease-out forwards; stroke-dasharray: 400; stroke-dashoffset: 400; }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="14" ry="14"/>
  <line x1="50" y1="180" x2="750" y2="180" stroke="url(#accent)" stroke-width="2" class="line"/>
  <circle cx="400" cy="60" r="4" fill="#dc2626" class="glow"/>
  <circle cx="400" cy="60" r="8" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.3" class="glow"/>
</svg>
