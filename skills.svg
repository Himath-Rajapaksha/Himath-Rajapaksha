<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <style>
    .skill-bar { animation: fill 1.5s ease-out forwards; transform-origin: left; transform: scaleX(0); }
    .label { animation: fadein 0.8s ease-out forwards; opacity: 0; }
    @keyframes fill { to { transform: scaleX(1); } }
    @keyframes fadein { to { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#0d0d10" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#card-bg)" rx="14" ry="14"/>
  <text x="56" y="45" fill="#f7f7fb" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Stack</text>
  <!-- Languages -->
  <g class="label" style="animation-delay: 0.2s">
    <text x="56" y="90" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="12">TypeScript</text>
    <rect x="180" y="80" width="200" height="8" rx="4" fill="#1e1e2e"/>
    <rect x="180" y="80" width="200" height="8" rx="4" fill="#3178C6" class="skill-bar" style="animation-delay: 0.3s"/>
  </g>
  <g class="label" style="animation-delay: 0.4s">
    <text x="56" y="120" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="12">JavaScript</text>
    <rect x="180" y="110" width="180" height="8" rx="4" fill="#1e1e2e"/>
    <rect x="180" y="110" width="180" height="8" rx="4" fill="#F7DF1E" class="skill-bar" style="animation-delay: 0.5s"/>
  </g>
  <g class="label" style="animation-delay: 0.6s">
    <text x="56" y="150" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="12">Python</text>
    <rect x="180" y="140" width="160" height="8" rx="4" fill="#1e1e2e"/>
    <rect x="180" y="140" width="160" height="8" rx="4" fill="#3776AB" class="skill-bar" style="animation-delay: 0.7s"/>
  </g>
  <g class="label" style="animation-delay: 0.8s">
    <text x="56" y="180" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="12">Rust</text>
    <rect x="180" y="170" width="100" height="8" rx="4" fill="#1e1e2e"/>
    <rect x="180" y="170" width="100" height="8" rx="4" fill="#CE422B" class="skill-bar" style="animation-delay: 0.9s"/>
  </g>
  <!-- Frameworks -->
  <g class="label" style="animation-delay: 1s">
    <text x="440" y="90" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="12">Next.js</text>
    <rect x="560" y="80" width="180" height="8" rx="4" fill="#1e1e2e"/>
    <rect x="560" y="80" width="180" height="8" rx="4" fill="#f7f7fb" class="skill-bar" style="animation-delay: 1.1s"/>
  </g>
  <g class="label" style="animation-delay: 1.2s">
    <text x="440" y="120" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="12">Tauri</text>
    <rect x="560" y="110" width="150" height="8" rx="4" fill="#1e1e2e"/>
    <rect x="560" y="110" width="150" height="8" rx="4" fill="#FFC131" class="skill-bar" style="animation-delay: 1.3s"/>
  </g>
  <g class="label" style="animation-delay: 1.4s">
    <text x="440" y="150" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="12">Supabase</text>
    <rect x="560" y="140" width="140" height="8" rx="4" fill="#1e1e2e"/>
    <rect x="560" y="140" width="140" height="8" rx="4" fill="#3ECF8E" class="skill-bar" style="animation-delay: 1.5s"/>
  </g>
  <g class="label" style="animation-delay: 1.6s">
    <text x="440" y="180" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="12">GNOME</text>
    <rect x="560" y="170" width="120" height="8" rx="4" fill="#1e1e2e"/>
    <rect x="560" y="170" width="120" height="8" rx="4" fill="#4A86CF" class="skill-bar" style="animation-delay: 1.7s"/>
  </g>
</svg>
