<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <style>
    @keyframes type { from { width: 0; } to { width: 100%; } }
    @keyframes fade { 0% { opacity: 0; transform: translateX(-8px); } 100% { opacity: 1; transform: translateX(0); } }
    .tag { animation: fade 0.5s ease-out both; }
    .t1 { animation-delay: 0.1s; } .t2 { animation-delay: 0.2s; } .t3 { animation-delay: 0.3s; }
    .t4 { animation-delay: 0.4s; } .t5 { animation-delay: 0.5s; } .t6 { animation-delay: 0.6s; }
    .t7 { animation-delay: 0.7s; } .t8 { animation-delay: 0.8s; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#0d0d10" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="14" ry="14"/>
  <!-- Header -->
  <text x="56" y="40" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="13" opacity="0.5">$ cat stack.json</text>
  <line x1="56" y1="52" x2="260" y2="52" stroke="#dc2626" stroke-width="1" opacity="0.4"/>
  <!-- Languages -->
  <text x="56" y="80" fill="#dc2626" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">"languages"</text>
  <g>
    <rect x="56" y="92" width="80" height="28" rx="6" fill="#3178C6" opacity="0.15" stroke="#3178C6" stroke-width="1" class="tag t1"/>
    <text x="96" y="110" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" class="tag t1">TypeScript</text>
    <rect x="148" y="92" width="80" height="28" rx="6" fill="#F7DF1E" opacity="0.15" stroke="#F7DF1E" stroke-width="1" class="tag t2"/>
    <text x="188" y="110" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" class="tag t2">JavaScript</text>
    <rect x="240" y="92" width="68" height="28" rx="6" fill="#3776AB" opacity="0.15" stroke="#3776AB" stroke-width="1" class="tag t3"/>
    <text x="274" y="110" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" class="tag t3">Python</text>
    <rect x="320" y="92" width="56" height="28" rx="6" fill="#CE422B" opacity="0.15" stroke="#CE422B" stroke-width="1" class="tag t4"/>
    <text x="348" y="110" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" class="tag t4">Rust</text>
  </g>
  <!-- Frameworks -->
  <text x="56" y="148" fill="#dc2626" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">"frameworks"</text>
  <g>
    <rect x="56" y="160" width="68" height="28" rx="6" fill="#f7f7fb" opacity="0.08" stroke="#f7f7fb" stroke-width="1" class="tag t5"/>
    <text x="90" y="178" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" class="tag t5">Next.js</text>
    <rect x="136" y="160" width="60" height="28" rx="6" fill="#FFC131" opacity="0.15" stroke="#FFC131" stroke-width="1" class="tag t6"/>
    <text x="166" y="178" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" class="tag t6">Tauri</text>
    <rect x="208" y="160" width="76" height="28" rx="6" fill="#3ECF8E" opacity="0.15" stroke="#3ECF8E" stroke-width="1" class="tag t7"/>
    <text x="246" y="178" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" class="tag t7">Supabase</text>
    <rect x="296" y="160" width="72" height="28" rx="6" fill="#4A86CF" opacity="0.15" stroke="#4A86CF" stroke-width="1" class="tag t8"/>
    <text x="332" y="178" fill="#f7f7fb" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" class="tag t8">GNOME</text>
  </g>
  <!-- Right side: terminal aesthetic -->
  <g transform="translate(520, 60)" opacity="0.6">
    <text x="0" y="0" fill="#6b7280" font-family="ui-monospace, monospace" font-size="10">{</text>
    <text x="16" y="18" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="10">"focus": [</text>
    <text x="32" y="36" fill="#dc2626" font-family="ui-monospace, monospace" font-size="10">"security",</text>
    <text x="32" y="54" fill="#3ECF8E" font-family="ui-monospace, monospace" font-size="10">"systems",</text>
    <text x="32" y="72" fill="#4A86CF" font-family="ui-monospace, monospace" font-size="10">"opensource"</text>
    <text x="16" y="90" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="10">]</text>
    <text x="0" y="108" fill="#6b7280" font-family="ui-monospace, monospace" font-size="10">}</text>
  </g>
</svg>
